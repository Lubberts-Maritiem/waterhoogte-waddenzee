<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waterhoogte Waddenzee</title>
<style>
  :root {
    --bg: #ffffff; --fg: #15202b; --muted: #66727f; --line: #e4e9ef; --grid: #f0f3f6;
    --card: #f5f7fa; --blue: #0a74c4; --red: #c62828; --grey: #9aa3ad; --now: #f0a400;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --fg: #eef2f6; --muted: #9aa6b2; --line: #28313b; --grid: #1b222a;
      --card: #19212a; --blue: #4fb0f5; --red: #ff6b6b; --grey: #7d8791; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 28px; }
  .picker { position: relative; display: inline-flex; align-items: center; max-width: 100%; }
  .picker select { -webkit-appearance: none; appearance: none; font: inherit; font-size: 20px; font-weight: 700;
    color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 40px 9px 14px; max-width: 100%; cursor: pointer; }
  .picker::after { content: "▾"; position: absolute; right: 14px; pointer-events: none; color: var(--muted); font-size: 16px; }
  .sublabel { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

  .big { margin: 6px 0 2px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .val { font-size: 56px; font-weight: 750; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1; }
  .unit { font-size: 16px; color: var(--muted); }
  .trend { font-size: 16px; font-weight: 600; }
  .when { font-size: 18px; font-weight: 600; margin-top: 6px; }
  .kind { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .kind .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

  .chart { margin-top: 12px; touch-action: pan-y; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; }
  .chart svg { display: block; width: 100%; }

  .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 48px;
    background: transparent; margin: 0; touch-action: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: var(--line); }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%;
    background: var(--blue); border: 4px solid var(--bg); box-shadow: 0 1px 5px rgba(0,0,0,.35); margin-top: -13px; }
  input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%;
    background: var(--blue); border: 4px solid var(--bg); box-shadow: 0 1px 5px rgba(0,0,0,.35); }
  .nowbtn { flex: none; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); font-size: 15px; font-weight: 600; touch-action: manipulation; cursor: pointer; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; border-radius: 2px;
    margin-right: 5px; vertical-align: 3px; background: var(--c); }
  .legend .dash::before { background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 7px); }

  h2 { font-size: 17px; margin: 22px 0 8px; }
  .tides { display: grid; gap: 6px; }
  .tide { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;
    background: var(--card); border-radius: 12px; padding: 12px 14px; cursor: pointer;
    border: 0; color: var(--fg); font: inherit; text-align: left; touch-action: manipulation; }
  .tide .ty { font-weight: 600; }
  .tide .tm { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tide .h { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }

  .all { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
  .loc { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--card);
    border: 2px solid transparent; border-radius: 10px; padding: 9px 10px; font: inherit; font-size: 14px;
    color: var(--fg); cursor: pointer; text-align: left; touch-action: manipulation; }
  .loc.sel { border-color: var(--blue); }
  .loc .n { overflow-wrap: anywhere; line-height: 1.2; }
  .loc .v { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .loc .v i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .hint { font-size: 13px; color: var(--muted); margin: -4px 0 8px; }
  .topbar { display: flex; align-items: center; flex-wrap: wrap; gap: 0 8px; }
  .rwslink { margin-left: auto; font-size: 13px; color: var(--blue); text-decoration: none; padding: 6px 0; white-space: nowrap; }
  .disclaimer { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }
  .disclaimer a { color: var(--blue); }
  .foot { margin-top: 20px; font-size: 12px; color: var(--muted); }
  .foot .warn { color: var(--red); font-weight: 600; }
  .foot a { color: var(--blue); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <label class="picker"><select id="loc" aria-label="Kies locatie"></select></label>
    <a class="rwslink" id="chartlink" href="chart">RWS weergave →</a>
  </div>
  <p class="sublabel">Waterhoogte</p>
  <div class="big"><span class="val" id="val">–</span><span class="unit">cm NAP</span><span class="trend" id="trend"></span></div>
  <div class="when" id="when">Laden…</div>
  <div class="kind" id="kind"></div>

  <div class="chart" id="chart"></div>
  <div class="slider-row">
    <input type="range" id="slider" aria-label="Kies tijdstip">
    <button class="nowbtn" id="nowbtn">Nu</button>
  </div>
  <div class="legend">
    <span style="--c: var(--blue)">gemeten</span>
    <span style="--c: var(--red)">verwachting RWS</span>
    <span class="dash" style="--c: var(--grey)">alleen getij</span>
  </div>

  <h2>Alle locaties</h2>
  <p class="hint" id="allhint"></p>
  <div class="all" id="all"></div>

  <h2 id="tidetitle">Komende hoog- en laagwaters</h2>
  <div class="tides" id="tides"></div>

  <div class="foot" id="foot"></div>
  <p class="disclaimer">Geen dienst van Rijkswaterstaat. Ruwe, ongecontroleerde gegevens, niet bedoeld voor navigatie. Gebruik op eigen risico. Geen cookies.</p>
</div>

<script>
(() => {
  const TZ = 'Europe/Amsterdam', STEP = 10, BACK = 1440, AHEAD = 2 * 1440;
  const $ = id => document.getElementById(id);
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const fmt = (m, o) => new Intl.DateTimeFormat('nl-NL', { timeZone: TZ, ...o }).format(new Date(m * 60000));
  const hhmm = m => fmt(m, { hour: '2-digit', minute: '2-digit' });
  const dayTime = m => fmt(m, { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + hhmm(m);
  const shortDT = m => fmt(m, { weekday: 'short' }) + ' ' + hhmm(m);
  const cm = v => v == null ? '–' : (v > 0 ? '+' : '') + Math.round(v);
  const localHM = m => {
    const p = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(m * 60000));
    return +p.find(x => x.type === 'hour').value * 60 + +p.find(x => x.type === 'minute').value;
  };
  const slug = code => code.replace(/\./g, '-');
  const KIND = { m: ['--blue', 'Gemeten'], v: ['--red', 'Verwachting Rijkswaterstaat'], a: ['--grey', 'Alleen getij (wind niet meegerekend)'] };

  let LOCS = [], sel = 0, nowMin = 0, cursor = 0, t0 = 0, t1 = 0, gen = 0;

  // Compacte reeks {i0, v[]} -> [[minuut, waarde], ...]
  const decode = (s, T0, step) => !s ? [] : s.v.map((v, i) => v == null ? null : [T0 + (s.i0 + i) * step, v]).filter(Boolean);

  // Eén doorlopende lijn: gemeten tot nu, dan verwachting, dan alleen getij.
  function build(loc, T0, step) {
    const m = decode(loc.series.meting, T0, step), v = decode(loc.series.verwachting, T0, step), a = decode(loc.series.astronomisch, T0, step);
    const endM = m.length ? m[m.length - 1][0] : -Infinity;
    const endV = v.length ? v[v.length - 1][0] : endM;
    const cut = Math.max(endM, endV);
    loc.line = m.map(p => [p[0], p[1], 'm'])
      .concat(v.filter(p => p[0] > endM).map(p => [p[0], p[1], 'v']))
      .concat(a.filter(p => p[0] > cut).map(p => [p[0], p[1], 'a']));
    loc.hasM = m.length > 0; loc.hasV = v.length > 0;
  }

  function at(line, t) {
    let lo = 0, hi = line.length - 1;
    if (hi < 0) return null;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (line[mid][0] < t) lo = mid + 1; else hi = mid; }
    let b = line[lo];
    if (lo > 0 && Math.abs(line[lo - 1][0] - t) < Math.abs(b[0] - t)) b = line[lo - 1];
    return Math.abs(b[0] - t) <= 15 ? b : null;
  }

  function extremes(line) {
    const out = [], W = 120;
    let j0 = 0, j1 = 0;
    for (let i = 0; i < line.length; i++) {
      const [t, v] = line[i];
      while (line[j0][0] < t - W) j0++;
      while (j1 < line.length - 1 && line[j1 + 1][0] <= t + W) j1++;
      if (line[j0][0] > t - W + 20 || line[j1][0] < t + W - 20) continue;
      let mx = -Infinity, mn = Infinity;
      for (let j = j0; j <= j1; j++) { mx = Math.max(mx, line[j][1]); mn = Math.min(mn, line[j][1]); }
      if (mx === mn) continue;
      const type = v === mx ? 'Hoogwater' : v === mn ? 'Laagwater' : null;
      if (!type) continue;
      const last = out[out.length - 1];
      if (last && last.type === type && t - last.t < 180) continue;
      out.push({ t, v, type });
    }
    return out.filter(e => e.t >= nowMin).slice(0, 4);
  }

  function draw() {
    if (!LOCS.length) return;
    const line = LOCS[sel].line;
    const el = $('chart'), W = Math.max(280, el.clientWidth), H = window.innerWidth < 600 ? 230 : 280;
    const L = 36, R = 6, T = 10, B = 24, iw = W - L - R, ih = H - T - B;
    const x = t => L + (t - t0) / (t1 - t0) * iw;
    let lo = Infinity, hi = -Infinity;
    line.forEach(p => { if (p[0] >= t0 && p[0] <= t1) { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); } });
    if (!isFinite(lo)) { lo = -100; hi = 100; }
    lo = Math.floor((lo - 10) / 50) * 50; hi = Math.ceil((hi + 10) / 50) * 50;
    const yStep = hi - lo > 400 ? 100 : 50;
    const y = v => T + (hi - v) / (hi - lo) * ih;
    const muted = css('--muted'), grid = css('--grid'), ln = css('--line');
    let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" xmlns="http://www.w3.org/2000/svg" font-size="12" font-family="system-ui,sans-serif">`;
    for (let v = Math.ceil(lo / yStep) * yStep; v <= hi; v += yStep) {
      s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? ln : grid}" stroke-width="${v === 0 ? 1.5 : 1}"/>`;
      s += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" fill="${muted}">${v}</text>`;
    }
    for (let t = t0 - localHM(t0) + 1440; t <= t1; t += 1440) {
      const hm = localHM(t); if (hm) t += hm > 720 ? 1440 - hm : -hm;
      s += `<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H - B}" stroke="${ln}"/>`;
      const lx = Math.min(x(t + 720), W - R - 14);
      if (t + 720 <= t1 + 300) s += `<text x="${lx}" y="${H - 6}" text-anchor="middle" fill="${muted}">${fmt(t + 720, { weekday: 'short' })}</text>`;
    }
    s += `<line x1="${x(nowMin)}" x2="${x(nowMin)}" y1="${T}" y2="${H - B}" stroke="${css('--now')}" stroke-width="2" stroke-dasharray="4 3"/>`;
    s += `<text x="${x(nowMin) + 4}" y="${T + 11}" fill="${css('--now')}" font-weight="700">nu</text>`;
    const style = { m: [css('--blue'), ''], v: [css('--red'), ''], a: [css('--grey'), ' stroke-dasharray="5 4"'] };
    for (const k of ['a', 'm', 'v']) {
      let d = '', prev = null;
      line.forEach((p, i) => {
        const inK = p[2] === k || (line[i + 1] && line[i + 1][2] === k); // sluit aan op het vorige stuk
        if (!inK || p[0] < t0 - STEP || p[0] > t1 + STEP) { prev = null; return; }
        d += (prev === null || p[0] - prev > 30 ? 'M' : 'L') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1);
        prev = p[0];
      });
      if (d) s += `<path d="${d}" fill="none" stroke="${style[k][0]}" stroke-width="2.5" stroke-linejoin="round"${style[k][1]}/>`;
    }
    const c = at(line, cursor);
    s += `<line x1="${x(cursor)}" x2="${x(cursor)}" y1="${T}" y2="${H - B}" stroke="${css('--fg')}" stroke-width="1.2"/>`;
    if (c) s += `<circle cx="${x(cursor)}" cy="${y(c[1])}" r="7" fill="${style[c[2]][0]}" stroke="${css('--bg')}" stroke-width="3"/>`;
    el.innerHTML = s + '</svg>';
    el._g = { L, iw, W };
  }

  function show() {
    if (!LOCS.length) return;
    const loc = LOCS[sel], line = loc.line;
    const c = at(line, cursor);
    $('val').textContent = c ? cm(c[1]) : '–';
    const a = at(line, cursor - 30), b = at(line, cursor + 30);
    $('trend').textContent = a && b ? (b[1] - a[1] > 2 ? '↑ stijgt' : b[1] - a[1] < -2 ? '↓ daalt' : '→ kentert') : '';
    $('when').textContent = (Math.abs(cursor - nowMin) < 10 ? 'Nu · ' : '') + dayTime(cursor);
    let kind = c ? `<span class="dot" style="background:${css(KIND[c[2]][0])}"></span>${KIND[c[2]][1]}` : 'Geen gegevens op dit tijdstip';
    if (!loc.hasM && !loc.hasV) kind += '<br>Rijkswaterstaat levert voor deze plek nu geen meting of verwachting.';
    else if (!loc.hasV) kind += c && c[2] === 'a' ? '<br>Voor deze plek is geen verwachting beschikbaar.' : '';
    $('kind').innerHTML = kind;
    draw();
    renderAll();
  }

  function renderAll() {
    $('allhint').textContent = (Math.abs(cursor - nowMin) < 10 ? 'Nu' : shortDT(cursor)) + ', in cm NAP. Tik op een plaats om die te bekijken.';
    $('all').querySelectorAll('.loc').forEach((el, i) => {
      const c = at(LOCS[i].line, cursor);
      el.classList.toggle('sel', i === sel);
      el.querySelector('.v').innerHTML = c ? `<i style="background:${css(KIND[c[2]][0])}"></i>${cm(c[1])}` : '–';
    });
  }

  function renderTides() {
    $('tidetitle').textContent = 'Komende hoog- en laagwaters ' + LOCS[sel].name;
    $('tides').innerHTML = extremes(LOCS[sel].line).map(e => `
      <button class="tide" data-t="${e.t}"><span class="ty">${e.type}</span>
      <span class="tm">${shortDT(e.t)}</span><span class="h">${cm(e.v)} cm</span></button>`).join('')
      || '<div class="kind">Geen gegevens.</div>';
    $('tides').querySelectorAll('.tide').forEach(b => b.addEventListener('click', () => {
      setCursor(+b.dataset.t); window.scrollTo({ top: 0, behavior: 'smooth' });
    }));
  }

  function select(i, fromHash) {
    sel = i;
    $('loc').value = i;
    try { localStorage.setItem('wad-loc', LOCS[i].code); } catch (_) {}
    if (!fromHash && location.hash.slice(1) !== slug(LOCS[i].code)) history.replaceState(null, '', '#' + slug(LOCS[i].code));
    document.title = 'Waterhoogte ' + LOCS[i].name;
    $('chartlink').href = 'chart?loc=' + slug(LOCS[i].code);
    renderTides();
    show();
  }

  function setCursor(t) {
    if (!LOCS.length) return;
    cursor = Math.min(t1, Math.max(t0, Math.round(t / STEP) * STEP));
    $('slider').value = cursor;
    show();
  }

  function init(d, keep) {
    const prevCursor = cursor, prevNow = nowMin;
    LOCS = d.locations;
    LOCS.forEach(l => build(l, d.t0, d.step));
    gen = Date.parse(d.generated) / 60000;
    nowMin = Math.floor(Date.now() / 60000);
    t0 = Math.floor((nowMin - BACK) / STEP) * STEP;
    t1 = Math.ceil((nowMin + AHEAD) / STEP) * STEP;
    const sl = $('slider'); sl.min = t0; sl.max = t1; sl.step = STEP;
    // Bij verversen: blijf op het gekozen tijdstip als de gebruiker heeft geschoven.
    cursor = keep && Math.abs(prevCursor - prevNow) >= 10 ? prevCursor : Math.round(nowMin / STEP) * STEP;
    sl.value = cursor;

    $('loc').innerHTML = LOCS.map((l, i) => `<option value="${i}">${l.name}</option>`).join('');
    $('all').innerHTML = LOCS.map((l, i) => `<button class="loc" data-i="${i}"><span class="n">${l.name}</span><span class="v"></span></button>`).join('');
    $('all').querySelectorAll('.loc').forEach(b => b.addEventListener('click', () => {
      select(+b.dataset.i); window.scrollTo({ top: 0, behavior: 'smooth' });
    }));

    const age = nowMin - gen;
    $('foot').innerHTML = `Gegevens van ${shortDT(gen)}` + (age > 360 ? ` · <span class="warn">${Math.round(age / 60)} uur oud</span>` : '') +
      `. Bron: <a href="https://waterinfo.rws.nl" target="_blank" rel="noopener">Rijkswaterstaat</a>.`;

    if (keep) { select(Math.min(sel, LOCS.length - 1), true); return; }
    let start = LOCS.findIndex(l => slug(l.code) === location.hash.slice(1));
    if (start < 0) { try { start = LOCS.findIndex(l => l.code === localStorage.getItem('wad-loc')); } catch (_) {} }
    select(Math.max(0, start), start >= 0 && slug(LOCS[start].code) === location.hash.slice(1));
  }

  $('loc').addEventListener('change', e => select(+e.target.value));
  window.addEventListener('hashchange', () => {
    const i = LOCS.findIndex(l => slug(l.code) === location.hash.slice(1));
    if (i >= 0 && i !== sel) select(i, true);
  });
  $('slider').addEventListener('input', e => { cursor = +e.target.value; show(); });
  $('nowbtn').addEventListener('click', () => setCursor(nowMin));

  // Slepen over de grafiek met vinger, pen of muis.
  const ch = $('chart'); let drag = false;
  const move = e => {
    const g = ch._g; if (!g) return;
    const r = ch.getBoundingClientRect();
    const px = (e.clientX - r.left) * (g.W / r.width);
    setCursor(t0 + Math.min(1, Math.max(0, (px - g.L) / g.iw)) * (t1 - t0));
  };
  ch.addEventListener('pointerdown', e => { drag = true; try { ch.setPointerCapture(e.pointerId); } catch (_) {} move(e); });
  ch.addEventListener('pointermove', e => { if (drag) move(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => ch.addEventListener(n, () => drag = false));

  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(draw, 120); });

  // Eerst live data (Vercel-functie api/data), anders het meegeleverde data.json.
  const getJSON = u => fetch(u, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const load = () => getJSON('api/data').then(d => ({ d, live: true })).catch(() => getJSON('data.json').then(d => ({ d, live: false })));
  load().then(({ d, live }) => {
    init(d);
    if (live) setInterval(() => load().then(({ d }) => init(d, true)).catch(() => {}), 10 * 60000);
  }).catch(() => { $('when').textContent = 'Kon de gegevens niet laden.'; });
})();
</script>
</body>
</html>
